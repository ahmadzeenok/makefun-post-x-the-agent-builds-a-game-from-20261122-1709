<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Dodge — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #05010f; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "DejaVu Sans Mono", monospace; }
  #wrap { position: relative; width: min(100vw, 56.25vh); aspect-ratio: 9 / 16; }
  canvas { display: block; width: 100%; height: 100%; background: #05010f; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
         padding: 14px 18px; color: #e8f6ff; font-size: 20px; font-weight: bold;
         text-shadow: 0 0 8px #00e5ff; pointer-events: none; }
  #msg { position: absolute; left: 0; right: 0; top: 38%; text-align: center; color: #fff;
         font-size: 26px; font-weight: bold; line-height: 1.5; text-shadow: 0 0 12px #ff2ea6;
         pointer-events: none; white-space: pre-line; }
  #sub { position: absolute; left: 0; right: 0; bottom: 3%; text-align: center; color: #9be7ff;
         font-size: 15px; text-shadow: 0 0 8px #00e5ff; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="960"></canvas>
  <div id="hud"><span id="score">SCORE 0</span><span id="lives">&#10084;&#10084;&#10084;</span></div>
  <div id="msg"></div>
  <div id="sub">ARROWS / DRAG TO FLY &nbsp;•&nbsp; TAP TO START</div>
</div>
<script>
"use strict";
// NEON DODGE — a tiny browser game built from one prompt.
// Fly the ship, dodge the asteroids, grab the stars. 3 lives. It gets faster.
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const msgEl = document.getElementById("msg");
const subEl = document.getElementById("sub");
const AUTO = new URLSearchParams(location.search).has("auto");

const ship = { x: W / 2, y: H - 170, r: 20, vx: 0, tilt: 0 };
let rocks = [], stars = [], parts = [], bgStars = [];
let score = 0, lives = 3, speed = 2.2, spawnT = 0, starT = 0, frame = 0;
let state = "ready"; // ready | playing | over
let keys = {};

for (let i = 0; i < 90; i++)
  bgStars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, v: Math.random() * 1.2 + 0.3 });

function rand(a, b) { return a + Math.random() * (b - a); }
function spawnRock() {
  rocks.push({ x: rand(30, W - 30), y: -40, r: rand(16, 34), v: speed * rand(0.8, 1.3), rot: rand(0, 6.28), vr: rand(-0.03, 0.03), hue: rand(280, 330) });
}
function spawnStar() {
  stars.push({ x: rand(30, W - 30), y: -20, r: 13, v: speed * 0.9, tw: rand(0, 6.28) });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++)
    parts.push({ x, y, vx: rand(-3, 3), vy: rand(-3, 3), life: 30, color });
}
function hit() {
  lives--;
  burst(ship.x, ship.y, "#ff2ea6", 26);
  if (lives <= 0) { state = "over"; msgEl.textContent = "GAME OVER\nSCORE " + score + "\n— tap to fly again —"; }
  else { ship.x = W / 2; ship.y = H - 170; rocks = rocks.filter(r => r.y > H * 0.6); }
}
function update() {
  frame++;
  for (const s of bgStars) { s.y += s.v; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
  if (state !== "playing") return;
  // steering: keys, pointer drag, or the auto-pilot (demo mode)
  let target = null;
  if (AUTO) {
    let danger = null, best = 1e9;
    for (const r of rocks) if (r.y > ship.y - 260 && r.y < ship.y + 40 && Math.abs(r.x - ship.x) < 110) {
      const d = ship.y - r.y; if (d < best) { best = d; danger = r; }
    }
    let star = null; best = 1e9;
    for (const s of stars) if (s.y < ship.y && ship.y - s.y < best) { best = ship.y - s.y; star = s; }
    target = danger ? ship.x + (danger.x > ship.x ? -90 : 90) : (star ? star.x : W / 2);
  }
  if (target !== null) ship.x += Math.max(-7, Math.min(7, target - ship.x)) ;
  else {
    if (keys.ArrowLeft || keys.KeyA) ship.vx -= 0.9;
    if (keys.ArrowRight || keys.KeyD) ship.vx += 0.9;
    if (dragX !== null) ship.x += Math.max(-9, Math.min(9, dragX - ship.x));
    ship.vx *= 0.86; ship.x += ship.vx;
  }
  ship.x = Math.max(24, Math.min(W - 24, ship.x));
  ship.tilt = Math.max(-0.4, Math.min(0.4, (ship.vx || 0) * 0.05));
  // spawning ramps up with the score
  speed = 2.2 + Math.min(3.4, score / 220);
  if (--spawnT <= 0) { spawnRock(); spawnT = Math.max(16, 46 - score / 14); }
  if (--starT <= 0) { spawnStar(); starT = rand(70, 150); }
  for (const r of rocks) { r.y += r.v; r.rot += r.vr; }
  for (const s of stars) { s.y += s.v; s.tw += 0.1; }
  rocks = rocks.filter(r => r.y < H + 50);
  stars = stars.filter(s => s.y < H + 30);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const r of rocks) {
    const dx = r.x - ship.x, dy = r.y - ship.y;
    if (dx * dx + dy * dy < (r.r + ship.r - 8) * (r.r + ship.r - 8)) { rocks.splice(rocks.indexOf(r), 1); hit(); break; }
  }
  for (const s of stars) {
    const dx = s.x - ship.x, dy = s.y - ship.y;
    if (dx * dx + dy * dy < (s.r + ship.r) * (s.r + ship.r)) {
      stars.splice(stars.indexOf(s), 1); score += 10; burst(s.x, s.y, "#ffe94d", 10);
    }
  }
  scoreEl.textContent = "SCORE " + score;
  livesEl.innerHTML = "&#10084;".repeat(Math.max(0, lives)) + "<span style='opacity:.25'>" + "&#10084;".repeat(Math.max(0, 3 - lives)) + "</span>";
}
function drawShip() {
  ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.tilt);
  ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 18;
  ctx.fillStyle = "#00e5ff";
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(16, 16); ctx.lineTo(0, 8); ctx.lineTo(-16, 16); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = "#ff2ea6";
  ctx.beginPath(); ctx.arc(0, -4, 5, 0, 6.29); ctx.fill();
  // engine flame
  ctx.fillStyle = "#ffb300";
  ctx.beginPath(); ctx.moveTo(-6, 16); ctx.lineTo(0, 16 + 10 + Math.random() * 12); ctx.lineTo(6, 16); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function draw() {
  ctx.fillStyle = "#05010f"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#cfe9ff";
  for (const s of bgStars) { ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(frame / 40 + s.x)); ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;
  for (const s of stars) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.tw);
    ctx.shadowColor = "#ffe94d"; ctx.shadowBlur = 14; ctx.fillStyle = "#ffe94d";
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? 5 : 13; ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  for (const r of rocks) {
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
    ctx.shadowColor = "#ff2ea6"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#3a0a2e"; ctx.strokeStyle = "#ff2ea6"; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283, rr = r.r * (0.8 + 0.25 * Math.sin(i * 2.7)); ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  for (const p of parts) { ctx.globalAlpha = p.life / 30; ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  if (state !== "over") drawShip();
  if (state === "ready") {
    ctx.fillStyle = "rgba(5,1,15,.55)"; ctx.fillRect(0, 0, W, H);
    drawShip();
    msgEl.textContent = "NEON DODGE\none prompt. one game.";
  }
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
function start() {
  if (state === "playing") return;
  score = 0; lives = 3; speed = 2.2; rocks = []; stars = []; parts = [];
  scoreEl.textContent = "SCORE 0"; livesEl.innerHTML = "&#10084;&#10084;&#10084;";
  msgEl.textContent = ""; subEl.textContent = "ARROWS / DRAG TO FLY";
  state = "playing";
}
let dragX = null;
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "Space" || e.code === "Enter") start();
});
addEventListener("keyup", e => { keys[e.code] = false; });
cv.addEventListener("pointerdown", e => { const r = cv.getBoundingClientRect(); dragX = (e.clientX - r.left) / r.width * W; if (state !== "playing") start(); });
cv.addEventListener("pointermove", e => { if (dragX === null) return; const r = cv.getBoundingClientRect(); dragX = (e.clientX - r.left) / r.width * W; });
addEventListener("pointerup", () => { dragX = null; });
if (AUTO) start();
loop();
</script>
</body>
</html>
